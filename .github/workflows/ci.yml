name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests with coverage
        run: mkdir -p .tmp && go test ./... -coverprofile=.tmp/coverage.out -covermode=atomic -count=1
      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=.tmp/coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Total Go coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total + 0 < 78.0) exit 1 }'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: .tmp/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  go:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -race ./... -timeout=15m
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: mkdir -p .tmp && go build -o .tmp/ats ./cmd/ats

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - name: Check embedded web assets
        run: test -z "$(git status --porcelain -- internal/webui/dist)"
